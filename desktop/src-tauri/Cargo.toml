[package]
name = "omni-cell-desktop"
version = "0.1.0"
edition = "2021"
description = "OMNI-CELL native shell: Tauri 2 window around the web UI, .omni file association, native file I/O"

[lib]
name = "omni_cell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
